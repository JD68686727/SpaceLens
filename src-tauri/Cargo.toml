[package]
name = "space-lens"
version = "0.1.0"
description = "A modern, clear disk usage analyzer – better than WinDirStat"
authors = ["you"]
edition = "2021"

[lib]
name = "space_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
anyhow = "1"
thiserror = "1"
once_cell = "1"
sysinfo = "0.32"
trash = "5"
blake3 = "1"
dashmap = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
